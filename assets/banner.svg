<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 717" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#ffffff" stroke-opacity="0.022" stroke-width="1"/>
    </pattern>
    <style>
      .cv { fill:#0d1117; }
      .o { opacity:0; }
      @keyframes rev { to { transform: translateX(824px); } }
      @keyframes fade { to { opacity:1; } }
      .cur { animation: blink 1.05s steps(1,end) infinite; }
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      @media (prefers-reduced-motion: reduce) { .cv{display:none} .o{opacity:1} .cur{animation:none} [class^="a"]{animation:none!important} }
      .a0{animation:rev 0.50s steps(25,end) 0.25s forwards}.a1{animation:fade 0.22s ease 0.79s forwards}.a2{animation:rev 0.60s steps(30,end) 0.92s forwards}.a3{animation:fade 0.22s ease 1.56s forwards}.a4{animation:fade 0.22s ease 1.69s forwards}.a5{animation:rev 0.90s steps(45,end) 1.82s forwards}.a6{animation:fade 0.22s ease 2.76s forwards}.a7{animation:fade 0.22s ease 2.89s forwards}.a8{animation:fade 0.22s ease 3.02s forwards}.a9{animation:fade 0.22s ease 3.15s forwards}.a10{animation:rev 0.78s steps(39,end) 3.28s forwards}.a11{animation:fade 0.22s ease 4.10s forwards}.a12{animation:fade 0.22s ease 4.23s forwards}.a13{animation:fade 0.22s ease 4.36s forwards}.a14{animation:fade 0.22s ease 4.49s forwards}.a15{animation:fade 0.22s ease 4.62s forwards}.a16{animation:rev 0.56s steps(28,end) 4.75s forwards}.a17{animation:fade 0.22s ease 5.35s forwards}.a18{animation:fade 0.22s ease 5.48s forwards}.a19{animation:fade 0.22s ease 5.61s forwards}.a20{animation:fade 0.22s ease 5.74s forwards}.a21{animation:rev 1.62s steps(81,end) 5.87s forwards}.a22{animation:rev 0.40s steps(20,end) 7.53s forwards}
    </style>
  </defs>

  <rect x="14" y="12" width="852" height="693" rx="14" fill="#0d1117" stroke="#222b36" stroke-width="1" filter="url(#shadow)"/>

  <g font-size="15" letter-spacing="0.2">
    <text x="40" y="66"><tspan fill="#3fb950">maxim@my-monkey</tspan><tspan fill="#6e7681">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#768390">$ </tspan><tspan fill="#c9d1d9">whoami</tspan></text><text class="o a1" x="40" y="91"><tspan fill="#56d364">→ </tspan><tspan fill="#e6edf3">Maxim</tspan><tspan fill="#a7b1bd"> · game dev @ Scalab Games · based in Montpellier</tspan></text><text x="40" y="129"><tspan fill="#3fb950">maxim@my-monkey</tspan><tspan fill="#6e7681">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#768390">$ </tspan><tspan fill="#c9d1d9">echo "$BIO"</tspan></text><text class="o a3" x="40" y="154"><tspan fill="#a7b1bd">I ship little things on the web — games, sites, tools, apps.</tspan></text><text class="o a4" x="40" y="179"><tspan fill="#a7b1bd">Mostly little things. A lot of them.</tspan></text><text x="40" y="217"><tspan fill="#3fb950">maxim@my-monkey</tspan><tspan fill="#6e7681">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#768390">$ </tspan><tspan fill="#c9d1d9">systemctl status my-monkey</tspan></text><text class="o a6" x="40" y="242"><tspan fill="#56d364">● </tspan><tspan fill="#e6edf3">my-monkey.service</tspan><tspan fill="#a7b1bd"> — part non-profit collective, part agency</tspan></text><text class="o a7" x="40" y="267"><tspan fill="#768390">   Active: </tspan><tspan fill="#56d364">active (shipping) </tspan><tspan fill="#a7b1bd">since day one</tspan></text><text class="o a8" x="40" y="292"><tspan fill="#768390">   Builds: </tspan><tspan fill="#a7b1bd">tools, apps &amp; websites for individuals and businesses,</tspan></text><text class="o a9" x="40" y="317"><tspan fill="#a7b1bd">           plus whatever silly idea sounds fun that week.</tspan></text><text x="40" y="355"><tspan fill="#3fb950">maxim@my-monkey</tspan><tspan fill="#6e7681">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#768390">$ </tspan><tspan fill="#c9d1d9">apt list --installed</tspan></text><text class="o a11" x="40" y="380"><tspan fill="#58a6ff">shipping-small-and-often  </tspan><tspan fill="#56d364">[installed] </tspan><tspan fill="#a7b1bd">perfect is the enemy of shipped</tspan></text><text class="o a12" x="40" y="405"><tspan fill="#58a6ff">technical-challenges      </tspan><tspan fill="#56d364">[installed] </tspan><tspan fill="#a7b1bd">the harder, the better</tspan></text><text class="o a13" x="40" y="430"><tspan fill="#58a6ff">cybersecurity             </tspan><tspan fill="#56d364">[installed] </tspan><tspan fill="#a7b1bd">many CTFs, podiums on nearly all</tspan></text><text class="o a14" x="40" y="455"><tspan fill="#58a6ff">self-hosting              </tspan><tspan fill="#56d364">[installed] </tspan><tspan fill="#a7b1bd">a server under my desk runs half of this</tspan></text><text class="o a15" x="40" y="480"><tspan fill="#58a6ff">automation                </tspan><tspan fill="#56d364">[installed] </tspan><tspan fill="#a7b1bd">even the things that didn't deserve it</tspan></text><text x="40" y="518"><tspan fill="#3fb950">maxim@my-monkey</tspan><tspan fill="#6e7681">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#768390">$ </tspan><tspan fill="#c9d1d9">docker ps</tspan></text><text class="o a17" x="40" y="543"><tspan fill="#768390">NAME      STATUS   URL</tspan></text><text class="o a18" x="40" y="568"><tspan fill="#e6edf3">games     </tspan><tspan fill="#56d364">up       </tspan><tspan fill="#58a6ff">games.my-monkey.fr    </tspan><tspan fill="#a7b1bd">· a new game every day</tspan></text><text class="o a19" x="40" y="593"><tspan fill="#e6edf3">blog      </tspan><tspan fill="#56d364">up       </tspan><tspan fill="#58a6ff">blog.my-monkey.fr     </tspan><tspan fill="#a7b1bd">· post-mortems &amp; lessons</tspan></text><text class="o a20" x="40" y="618"><tspan fill="#e6edf3">snaaplt   </tspan><tspan fill="#56d364">up       </tspan><tspan fill="#58a6ff">snaaplt.my-monkey.fr  </tspan><tspan fill="#a7b1bd">· local bookmark search</tspan></text><text x="40" y="656"><tspan fill="#3fb950">maxim@my-monkey</tspan><tspan fill="#6e7681">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#768390">$ </tspan><tspan fill="#6e7681"># I write code, computers slow it right back down. We're even.</tspan></text><text x="40" y="681"><tspan fill="#3fb950">maxim@my-monkey</tspan><tspan fill="#6e7681">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#768390">$ </tspan><tspan class="cur" fill="#56d364">█</tspan></text>
  </g>

  <g>
    <rect class="cv a0" x="40" y="51" width="824" height="21"/><rect class="cv a2" x="40" y="114" width="824" height="21"/><rect class="cv a5" x="40" y="202" width="824" height="21"/><rect class="cv a10" x="40" y="340" width="824" height="21"/><rect class="cv a16" x="40" y="503" width="824" height="21"/><rect class="cv a21" x="40" y="641" width="824" height="21"/><rect class="cv a22" x="40" y="666" width="824" height="21"/>
  </g>

  <rect x="14" y="42" width="852" height="663" fill="url(#scan)"/>

  <g>
    <path d="M14 26 a14 14 0 0 1 14 -14 h824 a14 14 0 0 1 14 14 v16 h-852 z" fill="#161b22"/>
    <line x1="14" y1="42" x2="866" y2="42" stroke="#222b36" stroke-width="1"/>
    <circle cx="40" cy="27" r="6" fill="#ff5f56"/>
    <circle cx="62" cy="27" r="6" fill="#febc2e"/>
    <circle cx="84" cy="27" r="6" fill="#28c840"/>
    <text x="440" y="31" text-anchor="middle" font-size="12.5" fill="#586069" letter-spacing="0.4">maxim@my-monkey — zsh</text>
  </g>
</svg>
